# Wakapi, one private instance per enrollment. The password salt, the sign-up switch and the public address are
# bound from the channel's `environment` in offering.json; the values below are the instance's fixed, non-secret
# settings. The image already sets the SQLite database path (/data/wakapi.db) and listens on 0.0.0.0:3000.
services:
  wakapi:
    image: ghcr.io/muety/wakapi:2.18.2@sha256:7a14217db1b6a47816c8d8d0590cc40fa12fd409dfed6c194bbb4cd50f43d913
    ports:
      - 3000
    environment:
      # The instance is reached over HTTPS through the platform's front end, so mark the session cookies Secure
      # (the image's default, "true", is meant for plain HTTP on localhost).
      WAKAPI_INSECURE_COOKIES: "false"
      # Never delete an account for inactivity. The image's configuration file removes accounts after 12 months
      # without activity, which would hit an instance that was simply stopped for a year.
      WAKAPI_MAX_INACTIVE_MONTHS: "-1"
    volumes:
      # The SQLite database (wakapi.db), the only file Wakapi keeps. The channel decides whether this volume
      # persists, in the wakapi folder of the customer's home (offering.json, `volumes`); under plain Docker it
      # is an ordinary named volume.
      - data:/data
    healthcheck:
      # The image is distroless (no shell, no curl or wget); it ships its own probe, which requests /api/health.
      test: [CMD, /app/healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 110s
volumes:
  data:
